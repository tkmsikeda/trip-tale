name: Build and push Lambda images

on:
  push:
    branches:
      - main
    paths:
      - "lambda/**"
  workflow_dispatch:

# OIDC で AWS のロールを引き受けるために必要な最小権限です。
permissions:
  contents: read
  id-token: write

concurrency:
  group: lambda-image-push-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed Lambda images
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            base=true
            formatter=true
            merger=true
            slideshow=true
            preparer=true
          else
            if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              changed_files=$(git ls-tree -r --name-only "$GITHUB_SHA" -- lambda)
            else
              changed_files=$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- lambda)
            fi

            changed() {
              grep -q "^$1/" <<< "$changed_files"
            }

            base=false
            formatter=false
            merger=false
            slideshow=false
            preparer=false
            orchestrator=false
            worker=false
            changed lambda/ffmpeg-image && base=true
            changed lambda/format-video && formatter=true
            changed lambda/merge-videos && merger=true
            changed lambda/slideshow && slideshow=true
            changed lambda/mitene-orchestrator && orchestrator=true
            changed lambda/mitene-worker && worker=true
            if grep -qx "lambda/preparation/preparer.py" <<< "$changed_files"; then
              preparer=true
            fi

            # 共通イメージの更新時は、それを利用する全 Lambda イメージを更新する。
            if [ "$base" = true ]; then
              formatter=true
              merger=true
              slideshow=true
            fi
          fi

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "formatter=$formatter" >> "$GITHUB_OUTPUT"
          echo "merger=$merger" >> "$GITHUB_OUTPUT"
          echo "slideshow=$slideshow" >> "$GITHUB_OUTPUT"
          echo "preparer=$preparer" >> "$GITHUB_OUTPUT"
          echo "orchestrator=$orchestrator" >> "$GITHUB_OUTPUT"
          echo "worker=$worker" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy video-preparer Lambda
        if: steps.changes.outputs.preparer == 'true'
        run: |
          set -euo pipefail

          cd lambda/preparation
          zip -j "$RUNNER_TEMP/video-preparer.zip" preparer.py
          aws lambda update-function-code \
            --function-name video-preparer \
            --zip-file "fileb://$RUNNER_TEMP/video-preparer.zip"
          aws lambda wait function-updated-v2 --function-name video-preparer

      - name: Deploy mitene-orchestrator Lambda
        if: steps.changes.outputs.orchestrator == 'true'
        run: |
          set -euo pipefail

          cd lambda/mitene-orchestrator
          zip "$RUNNER_TEMP/mitene-orchestrator.zip" lambda_function.py requirements.txt
          aws lambda update-function-code \
            --function-name mitene-orchestrator \
            --zip-file "fileb://$RUNNER_TEMP/mitene-orchestrator.zip"
          aws lambda wait function-updated-v2 --function-name mitene-orchestrator

      - name: Deploy mitene-worker Lambda
        if: steps.changes.outputs.worker == 'true'
        run: |
          set -euo pipefail

          cd lambda/mitene-worker
          zip "$RUNNER_TEMP/mitene-worker.zip" lambda_function.py requirements.txt
          aws lambda update-function-code \
            --function-name mitene-worker \
            --zip-file "fileb://$RUNNER_TEMP/mitene-worker.zip"
          aws lambda wait function-updated-v2 --function-name mitene-worker

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create required ECR repositories
        env:
          BASE_CHANGED: ${{ steps.changes.outputs.base }}
          FORMATTER_CHANGED: ${{ steps.changes.outputs.formatter }}
          MERGER_CHANGED: ${{ steps.changes.outputs.merger }}
          SLIDESHOW_CHANGED: ${{ steps.changes.outputs.slideshow }}
        run: |
          set -euxo pipefail

          create_repository() {
            aws ecr describe-repositories --repository-names "$1" || \
              aws ecr create-repository --repository-name "$1"
          }

          if [ "${BASE_CHANGED:-}" = true ]; then
            create_repository home-video/ffmpeg
          fi
          if [ "${FORMATTER_CHANGED:-}" = true ]; then
            create_repository home-video/formatter
          fi
          if [ "${MERGER_CHANGED:-}" = true ]; then
            create_repository home-video/merger
          fi
          if [ "${SLIDESHOW_CHANGED:-}" = true ]; then
            create_repository home-video/slideshow-maker
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push shared FFmpeg image
        if: steps.changes.outputs.base == 'true'
        uses: docker/build-push-action@v6
        with:
          context: lambda/ffmpeg-image
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/home-video/ffmpeg:latest
            ${{ steps.ecr-login.outputs.registry }}/home-video/ffmpeg:${{ github.sha }}

      - name: Build and push Lambda images
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          FORMATTER_CHANGED: ${{ steps.changes.outputs.formatter }}
          MERGER_CHANGED: ${{ steps.changes.outputs.merger }}
          SLIDESHOW_CHANGED: ${{ steps.changes.outputs.slideshow }}
        run: |
          set -euo pipefail

          build_and_push() {
            local context="$1"
            local repository="$2"

            docker buildx build \
              --platform linux/amd64 \
              --build-context trip-tale-ffmpeg=docker-image://${ECR_REGISTRY}/home-video/ffmpeg:latest \
              --provenance=false \
              --tag "${ECR_REGISTRY}/${repository}:latest" \
              --tag "${ECR_REGISTRY}/${repository}:${IMAGE_TAG}" \
              --push \
              "$context"
          }

          if [ "${FORMATTER_CHANGED:-}" = true ]; then
            build_and_push lambda/format-video home-video/formatter
          fi
          if [ "${MERGER_CHANGED:-}" = true ]; then
            build_and_push lambda/merge-videos home-video/merger
          fi
          if [ "${SLIDESHOW_CHANGED:-}" = true ]; then
            build_and_push lambda/slideshow home-video/slideshow-maker
          fi
